name: Docker smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.example'
      - 'ckan/**'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'nginx/**'
      - 'postgresql/**'

permissions:
  contents: read

concurrency:
  group: ckan-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Compose health and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start development stack
        run: |
          cp .env.example .env
          docker compose --env-file .env.example -f docker-compose.dev.yml up -d --build --wait
      - name: Check service health
        run: docker compose --env-file .env.example -f docker-compose.dev.yml ps
      - name: Check CKAN HTTP endpoints
        run: |
          curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:5000/api/action/status_show
          curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:5000/
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.dev.yml logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yml down -v
