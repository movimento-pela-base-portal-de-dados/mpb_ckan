{% set dataset_type = h.default_package_type() %}

<div class="home-search">
  <form class="search-form-home" method="get" action="{% url_for dataset_type ~ '.search' %}">
    <label class="home-explore-title" for="field-main-search">{{ _("Search data") }}</label>
    <div class="search-input form-group">
      <input id="field-main-search" type="text" class="form-control" name="q" value="" autocomplete="off" placeholder="Ex.: matrículas no ensino médio" />
      <button class="btn-search-home" type="submit" aria-label="Buscar">
        <i class="fa fa-search" aria-hidden="true"></i>
      </button>
    </div>
  </form>
</div>
