<section class="home-section home-hero">
  <div class="home-hero-art" aria-hidden="true">
    <span class="hero-triangle hero-l-triangle-yellow-light"></span>
    <span class="hero-triangle hero-l-triangle-yellow"></span>
    <span class="hero-triangle hero-l-triangle-coral"></span>

    <span class="hero-triangle hero-r-triangle-yellow-light"></span>
    <span class="hero-triangle hero-r-triangle-coral"></span>
  </div>
  <div class="container home-hero-inner">
    {% set intro = g.site_intro_text %}
    {% if intro %}
      {{ h.render_markdown(intro) }}
    {% else %}
      <h1>Bem-vindo(a) ao {{ g.site_title }}</h1>
      {% if g.site_description %}
        <h2>{{ g.site_description }}</h2>
      {% endif %}
    {% endif %}
  </div>
</section>
