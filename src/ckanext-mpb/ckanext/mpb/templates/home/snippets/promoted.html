
<div class="module-promotion card box">

  {% set intro = g.site_intro_text %}
  <div>
    {% if intro %}
      {{ h.render_markdown(intro) | safe }}
    {% else %}
    <div>
      <h1 class="page-heading" style="text-align: center; font-weight: bold;">Bem-vindo(a) ao {{ g.site_title }}</h1>
      {% if g.site_description %}
      <p>{{ g.site_description }}</p>
      {% endif %}
    </div>

    {% endif %}
  </div>
</div>
